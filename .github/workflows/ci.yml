name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy pipeline tests scripts

      # Four runs, one coverage number. The fast suite runs first and the gate
      # is switched off for it (the 70% floor lives in pyproject, so it has to
      # be overridden here); the Spark, model and dbt suites append to the same
      # data file and the combined total, judged on the last of them, is what
      # the build is gated on.
      #
      # The dbt suite needs the same Java install as the Spark one, because it
      # builds silver from the fixtures before it can run the models over it,
      # which is why it shares this job rather than getting its own. It also
      # builds `dbt/models/ml`, since `dbt run` and `dbt test` cover the whole
      # project and the feature table is part of it. The model suite needs no
      # Java at all and rides along for the coverage number.
      - name: Test
        run: uv run pytest --cov=pipeline --cov-report=term-missing --cov-fail-under=0

      - name: Test (Spark)
        run: uv run pytest -m spark --cov=pipeline --cov-append --cov-fail-under=0

      - name: Test (model)
        run: uv run pytest -m ml --cov=pipeline --cov-append --cov-fail-under=0

      - name: Test (dbt)
        run: uv run pytest -m dbt --cov=pipeline --cov-append --cov-fail-under=70
