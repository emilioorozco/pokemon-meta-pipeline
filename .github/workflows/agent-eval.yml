# The golden question set, scored against a real provider.
#
# Deliberately not on every pull request. One run is ten questions through a
# tool-calling loop, which is tens of model calls, and the answer it gives is
# noisy at that sample size: a set that costs money on every push and goes
# amber for a paraphrase is a set people start ignoring. So it runs weekly, on
# a push to main that touches the agent or the questions, and on demand. The
# fast checks in ci.yml stay the gate on a pull request, and they already cover
# the harness: `pytest -m dbt` replays recorded turns through the real tools
# against the same fixture marts and asserts ten out of ten, with no key and no
# bill. What this workflow adds is the only thing that needs a provider, which
# is whether the model still answers correctly.
#
# The marts are built here rather than downloaded: bronze, silver and gold over
# the committed fixtures, which is why the job installs Java. Nothing it reads
# or writes leaves the runner.
#
# Two jobs, and they measure different things. `golden` builds an agent on the
# runner out of this commit and scores it against the fixture marts: that is
# the code. `prod` sends the questions that are true of any warehouse to the
# deployed function over its URL and scores the
# responses: that is the thing members are talking to, which is a container
# built from some earlier commit, holding its own warehouse copy, its own gate
# settings and its own provider key. A green `golden` and a red `prod` is a
# deploy that has not landed, and until this job existed it looked like
# nothing at all.
#
# What `prod` costs. Each question is one agent loop on Haiku against the real
# warehouse, which is about a cent, so the fourteen it scores are roughly
# fourteen cents and the weekly schedule is well under a dollar a month. The
# ten adversarial questions are the cheap half, since a refusal is usually one
# model call with no tool behind it. The twelve fixture-fact questions are not
# sent at all, which is the other reason the bill went down rather than up
# when the set grew. The SQL gate on the function adds a fraction of a cent
# over the whole run (docs/sql-gate.md). That is the whole bill: the job
# installs nothing on AWS, writes nothing, and the only call it makes is the
# one `lambda:InvokeFunctionUrl` grant the application's stack gives the CI
# role.

name: Agent eval

on:
  schedule:
    # Monday morning, off the hour, so a queue of hourly jobs is not where this
    # one waits.
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - pipeline/agent.py
      - pipeline/prompts.py
      - pipeline/card_index.py
      - pipeline/eval.py
      - evals/**
      - .github/workflows/agent-eval.yml
  workflow_dispatch:

permissions:
  contents: read

# Not cancel-in-progress: two pushes in a minute should not leave the second
# run scored and the first one half charged for.
concurrency:
  group: ${{ github.workflow }}

jobs:
  golden:
    name: golden question set
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      # A fork, and a clone that nobody has given a key to, are the normal
      # state of this repository rather than a mistake, so the absence of the
      # secret is a notice and a green job. A red build for a missing key
      # teaches people to ignore the red build.
      - name: Look for a provider key
        id: key
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo '::notice title=Agent eval skipped::ANTHROPIC_API_KEY is not set for this repository, so the golden set was not scored. Set the secret to turn this job on; pytest -m dbt covers the harness either way.'
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - name: Install Java
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        if: steps.key.outputs.present == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: uv sync --locked --group dev

      # The same three commands docs/evals.md gives a reader, pointed at a
      # scratch directory so nothing lands in the repository's own data dir.
      # The anonymization key is generated here and thrown away with the
      # runner; the fixtures were anonymized under a key nobody kept.
      - name: Build the fixture marts
        if: steps.key.outputs.present == 'true'
        run: |
          echo "PIPELINE_DATA_DIR=$RUNNER_TEMP/eval" >> "$GITHUB_ENV"
          export PIPELINE_DATA_DIR="$RUNNER_TEMP/eval"
          HANDLE_HMAC_KEY=$(openssl rand -hex 32) uv run python -m pipeline.backfill \
            --source-dir tests/fixtures \
            --bronze-dir "$PIPELINE_DATA_DIR/lake/bronze" \
            --quarantine-dir "$PIPELINE_DATA_DIR/lake/quarantine"
          uv run python -m pipeline.silver \
            --bronze-dir "$PIPELINE_DATA_DIR/lake/bronze" \
            --silver-dir "$PIPELINE_DATA_DIR/lake/silver" \
            --catalog tests/catalog.json
          uv run python -m pipeline.gold --data-dir "$PIPELINE_DATA_DIR"

      # The hashing embedder, not the real one: the card questions are about
      # whether the agent looks the card up and reports what it found, and a
      # model download is minutes of runner time for a corpus of twelve cards.
      - name: Build the fixture card index
        if: steps.key.outputs.present == 'true'
        run: |
          uv run python -m pipeline.card_index build \
            --source tests/card_text.jsonl \
            --out "$PIPELINE_DATA_DIR/card_index" \
            --embedder hashing

      - name: Score the golden set
        if: steps.key.outputs.present == 'true'
        run: |
          uv run python -m pipeline.eval \
            --warehouse "$PIPELINE_DATA_DIR/warehouse/meta.duckdb" \
            --card-index "$PIPELINE_DATA_DIR/card_index"

      # Kept whether the run passed or failed, because the failing one is the
      # one worth reading: the report names the missing fact per question, and
      # the MLflow run beside it carries the prompt hash and the per-question
      # metrics.
      - name: Keep the report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-mlruns
          path: ${{ runner.temp }}/eval/mlruns
          if-no-files-found: warn
          retention-days: 30

  prod:
    name: the deployed agent
    runs-on: ubuntu-latest
    # After the local run rather than instead of it, and `always()` because
    # the interesting case is exactly the one where the two disagree: a
    # `golden` that failed on this commit says nothing about what is
    # deployed, and skipping the deployed check then would hide it.
    needs: golden
    if: always()
    environment: prod
    # Only `prod` trades an OpenID Connect token for a role; `golden` touches
    # no account and is left with the workflow's read-only default.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The same gate `nightly.yml` opens with, for the same reason: a fork, a
      # fresh clone and an environment nobody has configured yet are the
      # normal state of this repository, and none of the three should see a
      # red run for not having an AWS account.
      - name: Check the agent variables are set
        id: configured
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PIPELINE_CI_ROLE_ARN: ${{ vars.PIPELINE_CI_ROLE_ARN }}
          PIPELINE_AGENT_URL: ${{ vars.PIPELINE_AGENT_URL }}
        run: |
          missing=
          for name in AWS_REGION PIPELINE_CI_ROLE_ARN PIPELINE_AGENT_URL; do
            eval "value=\$$name"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Deployed agent eval skipped::unset environment variable(s):$missing. Set them on the prod environment to score the deployed service; the golden job covers this commit either way."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.configured.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # No Java, no marts, no card index: the warehouse and the index that
      # answer are the function's own, which is the whole point of the job.
      - name: Install dependencies
        if: steps.configured.outputs.ready == 'true'
        run: uv sync --locked --group dev

      - name: Assume the CI role
        if: steps.configured.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PIPELINE_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # `--remote` signs each call with these credentials and scores the
      # responses against the same golden file the job above used, so the two
      # rows of the same question are comparable. It scores the questions
      # marked `warehouse: any`, which is the ten adversarial ones and the
      # four shape-based ones, and reports the twelve fixture-fact questions
      # as skipped: those assert "1 game" and "2026-09-14" about the ten
      # committed fixtures, and the deployed service answers from the real
      # warehouse. `--no-mlflow` because there is no tracking store on this
      # runner and a `file:` one would be an MLflow directory nobody reads;
      # the JSON report is the artifact.
      - name: Score the deployed agent
        if: steps.configured.outputs.ready == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PIPELINE_AGENT_URL: ${{ vars.PIPELINE_AGENT_URL }}
          PRA_LOG_FORMAT: json
        run: |
          set -eu -o pipefail
          mkdir -p artifacts
          uv run python -m pipeline.eval \
            --remote "$PIPELINE_AGENT_URL" \
            --golden evals/golden.yaml \
            --no-mlflow --json | tee artifacts/remote_eval_report.json

      # The table in the job summary, so a red week is one page rather than a
      # download. `jq` rather than a second Python run: the report is already
      # JSON on disk, the step runs whether the scoring passed or failed, and
      # rendering it here cannot change the exit code that matters.
      - name: Put the table in the job summary
        if: always() && steps.configured.outputs.ready == 'true'
        run: |
          set -eu -o pipefail
          report=artifacts/remote_eval_report.json
          if [ ! -s "$report" ]; then
            echo "The deployed agent produced no report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            jq -r '"## The deployed agent: \(.passed)/\(.total) scored"
                   + (if .advisory_count > 0 then " (\(.advisory_count) advisory)" else "" end)
                   + ", \(.skipped | length) skipped"' "$report"
            echo
            echo "| question | kind | result | failed | advisory | tools called | gate |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            jq -r '.questions[]
                   | "| \(.id) | \(.kind) | \(if .passed then "pass" else "**FAIL**" end) "
                     + "| \(if (.failed_checks | length) > 0 then (.failed_checks | join(",")) else "-" end) "
                     + "| \(if (.advisory | length) > 0 then (.advisory | join(",")) else "-" end) "
                     + "| \(if (.tools_called | length) > 0 then (.tools_called | join(",")) else "-" end) "
                     + "| \(.gate) |"' "$report"
            echo
            jq -r 'if (.skipped | length) > 0
                   then "\(.skipped | length) skipped, \(.skipped_reason): \(.skipped | join(", "))"
                   else "Nothing was skipped." end' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      # Whether it passed or failed, because the failing one is the one worth
      # reading: the report names the missing fact and the forbidden pattern
      # per question, and on this job it also carries the statement the
      # deployed agent wrote.
      - name: Keep the report
        if: always() && steps.configured.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-prod-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
