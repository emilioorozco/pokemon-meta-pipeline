[project]
name = "pokemon-meta-pipeline"
version = "0.1.0"
description = "Batch pipeline: Pokémon TCG replay corpus -> metagame analytics warehouse"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=16",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dbt = ["dbt-duckdb>=1.8"]
orchestration = ["apache-airflow>=2.9"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
