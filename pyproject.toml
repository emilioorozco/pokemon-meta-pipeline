[project]
name = "pokemon-meta-pipeline"
version = "0.1.0"
description = "Analytics data platform for Play Rough Analytics: parsed Pokémon TCG games -> metagame warehouse, model, agent"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dbt = ["dbt-duckdb>=1.9"]
ml = [
    "lightgbm>=4.3",
    "mlflow>=3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.2",
]
orchestration = ["apache-airflow>=2.9"]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[s3]>=5",
    "boto3-stubs[s3]>=1.34",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyarrow-stubs>=17",
    "jsonschema>=4.21",
    "types-jsonschema>=4.21",
    # The silver tests run a real local SparkSession, so the engine is a dev
    # dependency as well as the optional `spark` extra the command line needs.
    "pyspark>=3.5",
    # Same reason for the gold tests: `pytest -m dbt` builds the models for
    # real, so the adapter is a dev dependency as well as the `dbt` extra.
    "dbt-duckdb>=1.9",
    # And the same again for the model tests: `pytest -m ml` trains a real
    # LightGBM model into a real MLflow run, so the `ml` extra is also dev.
    "lightgbm>=4.3",
    "mlflow>=3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.mypy]
# 3.12 rather than the 3.11 floor the package supports: numpy ships its stubs
# with PEP 695 `type` statements, which mypy refuses to parse when it is told
# to assume 3.11, and the choice is between analysing under 3.12 semantics or
# not type checking anything that imports numpy. Real 3.11 compatibility is
# still covered, by ruff's `target-version` and by CI running the tests on it.
python_version = "3.12"
files = ["pipeline", "tests", "scripts"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The legacy package warns on import, which happens at collection time where a
# per-module pytestmark cannot reach it. tests/legacy asserts the warning explicitly.
filterwarnings = ["ignore:pipeline.legacy.kaggle is deprecated:DeprecationWarning"]
markers = [
    "spark: needs a JVM",
    "dbt: builds the dbt models; needs a JVM for the silver input it reads",
    "ml: trains a model into a real MLflow run; no JVM, but slow",
]
# The Spark tests start a Java Virtual Machine, which costs seconds and a Java
# install, and the dbt tests build silver first and then run dbt over it, so
# `pytest` is the fast suite and the two markers are the slow ones. A
# command-line -m overrides this, so `pytest -m spark`, `pytest -m dbt` and
# `pytest -m ml` each run only their own. The `ml` tests need no Java: they
# build a synthetic feature table straight into a temporary DuckDB file, so
# they are excluded for their seconds rather than for their dependencies.
addopts = "-m 'not spark and not dbt and not ml'"

# LightGBM, MLflow, scikit-learn and matplotlib publish no type information mypy
# can use, so their imports are untyped rather than wrong.
[[tool.mypy.overrides]]
module = ["lightgbm.*", "mlflow.*", "sklearn.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pipeline"]
branch = true
# Deprecated code stays runnable and tested but must not prop up the gate.
omit = ["pipeline/legacy/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == "__main__":']
