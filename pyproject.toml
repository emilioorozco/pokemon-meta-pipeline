[project]
name = "pokemon-meta-pipeline"
version = "0.1.0"
description = "Analytics data platform for Play Rough Analytics: parsed Pokémon TCG games -> metagame warehouse, model, agent"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dbt = ["dbt-duckdb>=1.8"]
orchestration = ["apache-airflow>=2.9"]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[s3]>=5",
    "boto3-stubs[s3]>=1.34",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyarrow-stubs>=17",
    "jsonschema>=4.21",
    "types-jsonschema>=4.21",
    # The silver tests run a real local SparkSession, so the engine is a dev
    # dependency as well as the optional `spark` extra the command line needs.
    "pyspark>=3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.mypy]
python_version = "3.11"
files = ["pipeline", "tests", "scripts"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The legacy package warns on import, which happens at collection time where a
# per-module pytestmark cannot reach it. tests/legacy asserts the warning explicitly.
filterwarnings = ["ignore:pipeline.legacy.kaggle is deprecated:DeprecationWarning"]
markers = ["spark: needs a JVM"]
# The Spark tests start a Java Virtual Machine, which costs seconds and a Java
# install, so `pytest` is the fast suite and `pytest -m spark` is the slow one.
# A command-line -m overrides this, so `pytest -m spark` runs only those.
addopts = "-m 'not spark'"

[tool.coverage.run]
source = ["pipeline"]
branch = true
# Deprecated code stays runnable and tested but must not prop up the gate.
omit = ["pipeline/legacy/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == "__main__":']
