[project]
name = "pokemon-meta-pipeline"
version = "0.1.0"
description = "Batch pipeline: Pokémon TCG replay corpus -> metagame analytics warehouse"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=16",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dbt = ["dbt-duckdb>=1.8"]
orchestration = ["apache-airflow>=2.9"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyarrow-stubs>=17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.mypy]
python_version = "3.11"
files = ["pipeline", "tests"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pipeline"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == "__main__":']
