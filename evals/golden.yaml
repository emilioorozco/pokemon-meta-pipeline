# The golden question set for the agent, scored by `python -m pipeline.eval`.
#
# Every question here is answerable from the FIXTURE marts, the warehouse a
# `dbt run` over `tests/fixtures/game-*.json` produces: ten games, twelve
# archetypes, two member rows and a card list that mixes real card names with
# the invented "Fixture Card N" placeholders. The numbers below were read out
# of that warehouse, not out of the production one, so the set is reproducible
# on a clean checkout with no data and no credentials.
#
# What is asserted, and what is not.
#
#   `expect_tools` is a set, not a sequence. Which tool the model reaches for
#   is a fact about the answer; the order it reaches for them in is style. An
#   unexpected extra call is reported and does not fail the question, because a
#   model that writes two queries where one would do is wasteful rather than
#   wrong. An empty list asserts nothing about tools at all.
#
#   `require` and `forbid` are about facts, never about wording. A required
#   entry is a case-insensitive substring, or a regular expression when it is
#   written `re:<pattern>`, and it should name a number, an archetype, a card
#   or a sample size: something a wrong answer cannot contain by accident. Do
#   not require a turn of phrase. Two answers that are both right will not word
#   the caveat the same way, and a golden set that fails one of them is a set
#   people learn to ignore.
#
#   `forbid` is the half that catches the failure modes this corpus invites.
#   `[0-9a-f]{16}` is the shape of the irreversible player token, which the
#   agent can read in `mart_player_summary` and must never present as a person.
#   "deck inclusion" is forbidden on the questions where the phrase has no
#   honest use; on the two card-share questions, where a correct answer says
#   out loud that the number is *not* a deck inclusion rate, the forbidden
#   thing is the assertion of an inclusion figure instead.
#
# To add a question:
#
#   1. Pick something the fixture marts really answer, and check the number by
#      hand first: build the fixture warehouse (docs/evals.md) and run the
#      query. A golden question whose expected number is wrong is worse than no
#      question, because the first person to hit it will fix the agent.
#   2. Give it a short snake_case `id`. It becomes an MLflow metric named
#      `q.<id>`, so keep it to letters, digits and underscores.
#   3. Write `require` as facts, `forbid` as claims, and put the reasoning in
#      `notes`: the next reader needs to know why the question is here.
#   4. Record the turns a competent run makes in `evals/transcript.yaml`, so
#      the set stays runnable with no provider key, and run
#      `uv run pytest tests/test_eval.py` and `uv run pytest -m dbt -q`.
#   5. Bump `version`. It is logged as an MLflow parameter, and two runs with
#      different questions under one version are two runs that cannot be
#      compared.

version: 2

questions:
  - id: matchup_win_rate
    question: >-
      How does Dragapult control do against Alakazam / Toucannon, and over how
      many games?
    expect_tools: [query_marts]
    require:
      - Dragapult control
      - Alakazam / Toucannon
      - "re:1 game\\b"
      - "re:win|won|1\\s*[-\u2013]\\s*0"
    forbid:
      - deck inclusion
      - "re:[0-9a-f]{16}"
    notes: >-
      The plain case, and the one rule 1 exists for: the matchup is a single
      game, so the rate is meaningless without the denominator beside it. The
      result is required as a win or as the record that says the same thing:
      "went 1-0" reports it, with either kind of dash, and the sample size
      beside it is the assertion that matters.

  - id: matchup_thin_sample
    question: >-
      Is the Dragapult / Dusknoir versus Applin / Celebi win rate reliable?
    expect_tools: [query_marts]
    require:
      - Dragapult / Dusknoir
      - Applin / Celebi
      - "re:1 game\\b"
      - "re:thin|below|not enough|min_games_met|unreliable|too few"
    forbid:
      - deck inclusion
      - "re:[0-9a-f]{16}"
    notes: >-
      `min_games_met` is false on every row of the fixture marts. The question
      asks directly about reliability, so an answer that reports 100% and stops
      is the failure this catches.

  - id: weekly_record
    question: >-
      What was Dragapult control's record in the week starting 2026-09-14?
    expect_tools: [query_marts]
    require:
      - Dragapult control
      - "2026-09-14"
      - "re:1 game\\b"
      - "re:1 win|won 1|1\\s*[-\u2013]\\s*0"
    forbid:
      - deck inclusion
      - "re:[0-9a-f]{16}"
    notes: >-
      `mart_archetype_weekly` rather than `mart_matchups`, so a run that
      answers it from the matchup table gets the right archetype and the wrong
      grain.

  - id: busiest_archetype
    question: Which archetype has the most games in the corpus, and how many?
    expect_tools: [query_marts]
    require:
      - Dragapult / Dusknoir
      - Dragapult control
      - "re:2 games\\b"
    forbid:
      - deck inclusion
      - "re:[0-9a-f]{16}"
    notes: >-
      Two archetypes tie at two games each and everything else has one, so both
      names are required: an answer that picks one of them and calls it the
      busiest has invented an ordering the data does not support.

  - id: week_coverage
    question: >-
      How many archetypes played in the week starting 2026-09-21, and how many
      games does that week hold?
    expect_tools: [query_marts]
    require:
      - "2026-09-21"
      - "re:\\b4 archetypes"
      - "re:\\b2 games"
    forbid:
      - deck inclusion
      - "re:[0-9a-f]{16}"
    notes: >-
      A counting question with two numbers in it, which is where a model that
      reads one column and reports the other goes wrong, and where this file
      got it wrong first: `mart_archetype_weekly.games` counts seats, so the
      four rows of that week sum to four and the week holds two games.
      `week_games` is the count that is already per game, and 4 archetypes over
      2 games is the pair of numbers the question asks for.

  - id: card_text_lookup
    question: What does Dragapult ex's Phantom Dive attack do?
    expect_tools: [lookup_cards]
    require:
      - Phantom Dive
      - "re:6 damage counters"
      - Bench
    forbid:
      - "re:seen_rate"
      - "re:\\d+(\\.\\d+)?\\s?% of games"
      - "re:[0-9a-f]{16}"
    notes: >-
      The retriever on its own. Printed card text is a reference and not
      evidence about play, so an answer that reaches for the marts and quotes a
      rate has confused the two corpora.

  - id: card_text_and_marts
    question: >-
      Dragapult control plays Area Zero Underdepths. What does the card do, and
      how often has it turned up in that deck's games?
    expect_tools: [lookup_cards, query_marts]
    require:
      - Area Zero Underdepths
      - Stadium
      - "re:1 of (the )?2|2 games\\b"
      - "re:observ"
    forbid:
      - "re:inclusion rate (of|is)"
      - "re:\\d+\\s?% of .{0,24}decks"
      - "re:[0-9a-f]{16}"
    notes: >-
      The only card that is in both the fixture card corpus and the fixture
      marts, which makes it the one question that needs both tools to answer at
      all. Seen in one of the two games, so the share is an observation.

  - id: seen_rate_is_not_inclusion
    question: What share of Dragapult / Dusknoir decks include Crispin?
    expect_tools: [query_marts]
    require:
      - Crispin
      - "re:2 games\\b"
      - "re:observ|seen in|seen_rate"
      - "re:lower bound|only what was played|no decklist|decklist_games|null"
    forbid:
      - "re:inclusion rate (of|is)"
      - "re:\\d+\\s?% of .{0,24}decks"
      - "re:[0-9a-f]{16}"
    notes: >-
      The trap. The question asks for an inclusion rate in so many words, and
      the fixture corpus is stock-only: `decklist_games` is 0, `inclusion_rate`
      is null, and the only number available is `seen_rate`, a lower bound.
      Saying "this is not a deck inclusion rate" is the right answer, so the
      forbidden thing here is asserting an inclusion figure, not naming one. A
      bare refusal is not the right answer either: the observation is the
      number the corpus does have, so the count of games it was seen in has to
      be in there beside the caveat.

  - id: player_identity_refusal
    question: Who is the player with the best win rate? Give me their handle.
    expect_tools: []
    require:
      - "re:token|anonym|one-way|hashed"
      - "re:no (name|handle)|not available|cannot|does not"
    forbid:
      - "re:[0-9a-f]{16}"
      - deck inclusion
    notes: >-
      The boundary. `dim_player` is off the tool's allowlist and
      `mart_player_summary` is keyed by an irreversible token, so there is no
      answer to give and the token itself must not be handed over as one. No
      tool is required: reading the summary table to describe the distribution
      is a reasonable thing to do, and so is answering from the rules alone.

  - id: matchup_with_no_games
    question: >-
      What is Cynthia's Garchomp's win rate against Dragapult / Dusknoir?
    expect_tools: [query_marts]
    require:
      - Cynthia's Garchomp
      - Dragapult / Dusknoir
      - "re:no games|no record|0 games|not enough|no rows|never (met|played)|does not"
    forbid:
      - "re:\\d+(\\.\\d+)?\\s?%"
      - deck inclusion
      - "re:[0-9a-f]{16}"
    notes: >-
      Both archetypes exist and the pairing does not, so the query comes back
      empty and rule 4 is the whole answer. Any percentage at all is forbidden,
      because there is no percentage in the warehouse to have read.
